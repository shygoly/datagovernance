name: Primitives Anti-Drift Guard

on:
  pull_request:
  push:
    branches: [main, docs/governance-model]

jobs:
  verify-primitives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run strict primitives anti-drift checks
        run: python3 scripts/verify-primitives.py --strict

      - name: Run A0.4 agent regression evals (pass^3 gate)
        run: python3 scripts/run-agent-evals.py --suite regression --trials 3 --mode offline
