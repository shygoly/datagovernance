server:
  port: ${DG_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: datagovernance
  datasource:
    url: ${DG_DB_URL:jdbc:postgresql://localhost:5432/datagovernance}
    username: ${DG_DB_USER:datagov}
    password: ${DG_DB_PASSWORD:datagov}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: dg-metadata-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: input          # 主键由 Ids.of(prefix) 生成,不用数据库自增
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

dg:
  security:
    # 凭据/密钥的 AES-GCM 主密钥。未配置时应用拒绝启动 —— 宁可起不来,
    # 也不要用一个内置默认值加密生产凭据。
    secret-key: ${DG_SECRET_KEY:}
    jwt:
      issuer: datagovernance
      # 单位小时。P1 无刷新令牌,过期即重新登录。
      ttl-hours: 8
      signing-key: ${DG_JWT_SIGNING_KEY:}
    # 无需认证即可访问的路径
    permit-paths:
      - /api/v1/auth/login
      - /api/v1/internal/agent/**
      - /api/v1/a2a/agent-card.json
      - /.well-known/agent-card.json
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/health

  bootstrap:
    enabled: true
    admin-username: admin
    # 留空则首次启动生成随机口令并打印到日志一次。
    # 绝不要在此处写死默认口令 —— 它会随代码库一起分发。
    admin-password: ${DG_ADMIN_PASSWORD:}
    default-workspace-code: default
    default-workspace-name: 默认空间

  catalog:
    # 结构浏览的快照有效期;超过则重新探测目标库(功能 5)
    snapshot-ttl-minutes: 30

  lineage:
    parser:
      # SQLGlot sidecar(lineage-parser-service)地址。留空则关闭 SQL 列级血缘解析，
      # 所有解析请求降级为 INCONCLUSIVE(C8)，不影响其余血缘通道。
      base-url: ${DG_LINEAGE_PARSER_URL:http://127.0.0.1:8091}
      # 单次解析超时。超时按 INCONCLUSIVE 降级，不阻塞作业编译 / 目录采集。
      timeout-ms: ${DG_LINEAGE_PARSER_TIMEOUT_MS:5000}
      circuit:
        # 连续失败达到阈值后熔断，冷却期内直接返回 INCONCLUSIVE，不再发请求。
        failure-threshold: 3
        cooldown-seconds: 30

  insight:
    # 原生语义问数网关（OpenSpec: semantic-ontology-kernel，已完全替代外部 SuperSonic）。
    engine: ${DG_INSIGHT_ENGINE:native}
    dialect: ${DG_INSIGHT_DIALECT:STARROCKS}
    agent-id: ${DG_INSIGHT_AGENT_ID:1}
    default-dataset-id: ${DG_INSIGHT_DATASET_ID:1}
    max-rows: ${DG_INSIGHT_MAX_ROWS:200}
    timeout-seconds: ${DG_INSIGHT_TIMEOUT_SECONDS:120}
    # Pi agent 服务（agent-service）调用内部工具端点的共享令牌。
    agent-token: ${DG_AGENT_TOKEN:}
    # Node sidecar 地址（只监听本机）。
    agent-base-url: ${DG_AGENT_URL:http://127.0.0.1:8090}
    # 本地/NFS 数据源允许的目录前缀白名单（逗号分隔；生产环境建议必填，如 /data/lakehouse,/mnt/nfs）
    local-root-allowlist: ${DG_LOCAL_ROOT_ALLOWLIST:}
    # OpenTelemetry GenAI 语义规约配置（生产默认关闭原始 Prompt 采集，防止患者 PII 泄露）
    otel:
      semconv-version: "1.42.0"
      capture-content: ${DG_OTEL_CAPTURE_CONTENT:false}

logging:
  level:
    root: INFO
    com.datagov: DEBUG
