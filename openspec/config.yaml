schema: spec-driven

context: |
  数据治理平台：Java 21 + Spring Boot 3.3 + PostgreSQL + Vue 3 + TypeScript + Element Plus。
  最高架构红线见 CONSTITUTION.md（C1–C10）；仓库导航见 AGENTS.md；
  架构边界见 SPACE-MODEL.md / ARCHITECTURE.md；治理原语见 GOVERNANCE-MODEL.md；
  智能体共性基座见 AGENT-PRIMITIVES.md；前端设计元语见 frontend/DESIGN.md；
  设计 token 在 frontend/src/styles/tokens.css；前端只消费 /api/v1，不直连 SuperSonic。
  AI 问数经 Query Gateway；StarRocks + MinIO 为当前 POC 服务层。
  前端 P0/P1/P2 计划见 docs/plans/2026-10-30-frontend-p0.md、2026-10-30-frontend-p1.md、2026-10-30-frontend-p2.md。

rules:
  proposal:
    - Keep proposals concise and include explicit Non-goals.
    - Include a brief Constitution Check against CONSTITUTION.md (C1–C10).
    - List affected routes/APIs, permissions/audit impact, and whether backend changes are required.
  tasks:
    - Group tasks by dependency order.
    - Include `python3 scripts/verify-primitives.py` and domain build/test verification (type-check/build for frontend, mvn test for backend).
